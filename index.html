<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Goûter Français — Bientôt disponible</title>
<meta name="description" content="Le Goûter Français arrive bientôt : cookies artisanaux inspirés de la pâtisserie française.">
<meta name="theme-color" content="#1F3329">

<meta property="og:type" content="website">
<meta property="og:title" content="Le Goûter Français — Bientôt disponible">
<meta property="og:description" content="Le goûter, à la française. Arrive bientôt.">
<meta property="og:url" content="https://legouterfrancais.com/">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://legouterfrancais.com/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --vert-sapin:#1F3329;
  --vert-sapin-clair:#2C4A3B;
  --or:#D8B36A;
  --bleu:#3F6FB5;
  --rouge:#C2473B;
  --creme:#F6EEDF;
  --blanc:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--creme);
  color:var(--vert-sapin);
  font-family:'Jost',sans-serif;
  font-weight:400;
  line-height:1.6;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
a{color:inherit;}

.tricolor-bar{
  width:120px;height:3px;display:flex;border-radius:2px;overflow:hidden;margin:22px auto 0;
}
.tricolor-bar span{flex:1;}
.tricolor-bar .b{background:var(--bleu);}
.tricolor-bar .w{background:var(--blanc);}
.tricolor-bar .r{background:var(--rouge);}

.wrap{
  max-width:560px;
  text-align:center;
}
.eyebrow{
  font-size:12.5px;text-transform:uppercase;letter-spacing:0.12em;
  color:var(--or);font-weight:600;margin-bottom:12px;
}
h1{
  font-family:'Fraunces',serif;font-style:italic;font-weight:500;
  font-size:clamp(34px,8vw,56px);
  margin:0;letter-spacing:0.2px;
}
.tagline{
  font-size:clamp(16px,2.6vw,19px);
  color:var(--vert-sapin-clair);
  margin-top:20px;
  font-weight:300;
}
.contact-email{
  display:inline-flex;align-items:center;gap:10px;
  margin-top:34px;
  padding:14px 26px;
  border-radius:14px;
  background:var(--blanc);
  border:1.5px solid rgba(216,179,106,0.4);
  font-size:15.5px;font-weight:600;color:var(--vert-sapin);
  text-decoration:none;
}
.contact-email svg{width:18px;height:18px;stroke:var(--or);flex:0 0 auto;}

.social-row{
  display:flex;justify-content:center;gap:14px;
  margin-top:28px;
}
.social-link{
  display:flex;align-items:center;justify-content:center;
  width:42px;height:42px;border-radius:50%;
  border:1.5px solid rgba(31,51,41,0.15);
  color:var(--vert-sapin);
  transition:border-color .15s ease, color .15s ease, transform .15s ease;
}
.social-link:hover{border-color:var(--or);color:var(--or);transform:translateY(-2px);}
.social-link svg{width:19px;height:19px;}

footer{
  margin-top:46px;
  color:rgba(31,51,41,0.4);
  font-size:12.5px;
}
</style>
</head>
<body>

<div class="wrap">
  <div class="eyebrow">Bientôt à Québec</div>
  <h1>Le Goûter Français</h1>
  <div class="tricolor-bar"><span class="b"></span><span class="w"></span><span class="r"></span></div>
  <p class="tagline">Le goûter, à la française.<br>Notre site arrive très bientôt.</p>

  <a class="contact-email" href="mailto:contact@legouterfrancais.com">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
    contact@legouterfrancais.com
  </a>

  <div class="social-row">
    <a class="social-link" href="https://www.instagram.com/legouterfrancais?igsh=MThwOGN4a2I0ZG10" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    </a>
  </div>

  <footer>© <span id="year"></span> Le Goûter Français</footer>
</div>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
