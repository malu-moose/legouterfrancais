server {
    listen 80;
    listen [::]:80;
    server_name legouterfrancais.com www.legouterfrancais.com;

    # Certbot uses this location for the HTTP-01 challenge, then rewrites
    # this whole block to redirect to HTTPS automatically.
    location / {
        return 301 https://legouterfrancais.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.legouterfrancais.com;

    ssl_certificate     /etc/letsencrypt/live/legouterfrancais.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legouterfrancais.com/privkey.pem;

    # www -> apex redirect
    return 301 https://legouterfrancais.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name legouterfrancais.com;

    root /var/www/legouterfrancais;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/legouterfrancais.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legouterfrancais.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparam.pem;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- Caching ----
    location ~* \.(jpg|jpeg|png|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Block hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/legouterfrancais.access.log;
    error_log  /var/log/nginx/legouterfrancais.error.log;
}
