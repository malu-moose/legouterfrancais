<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Le Gouffre — suivi du congélateur</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Le Gouffre">
<meta name="theme-color" content="#0F2B44">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --navy-deep:#081826;
    --navy:#0F2B44;
    --navy-mid:#173A57;
    --ice:#8FD3F4;
    --ice-soft:#C9EAFA;
    --frost:#EAF6FC;
    --white:#F7FBFD;
    --warn:#E8734A;
    --warn-strong:#D9432B;
    --ok:#4FBE8C;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(143,211,244,0.12), transparent 45%),
      radial-gradient(ellipse at 90% 0%, rgba(143,211,244,0.08), transparent 40%),
      linear-gradient(180deg, var(--navy-deep), #050E17 85%);
    color:var(--frost);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:0 0 60px 0;
  }

  .wrap{max-width:880px; margin:0 auto; padding:36px 20px 0;}

  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:1px solid rgba(143,211,244,0.18);
    padding-bottom:22px; margin-bottom:26px;
    flex-wrap:wrap; gap:14px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:28px; margin:0 0 6px 0; font-weight:700;
    letter-spacing:-0.01em;
  }
  .tagline{color:var(--ice-soft); font-size:13.5px; opacity:0.75; margin:0;}
  .stats{display:flex; gap:22px;}
  .stat{text-align:right;}
  .stat .n{font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; color:var(--ice);}
  .stat .l{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ice-soft); opacity:0.6;}

  .panel{
    background:linear-gradient(180deg, rgba(23,58,87,0.55), rgba(15,43,68,0.4));
    border:1px solid rgba(143,211,244,0.15);
    border-radius:14px;
    padding:22px;
    margin-bottom:22px;
  }
  .panel h2{
    font-family:'Space Grotesk', sans-serif; font-size:15px; margin:0 0 16px 0;
    text-transform:uppercase; letter-spacing:0.07em; color:var(--ice-soft); font-weight:600;
  }

  form{display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:10px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field.full{grid-column:1 / -1;}
  label{font-size:11px; color:var(--ice-soft); opacity:0.7; text-transform:uppercase; letter-spacing:0.05em;}
  input, select, textarea{
    background:rgba(8,24,38,0.6);
    border:1px solid rgba(143,211,244,0.25);
    border-radius:8px;
    color:var(--white);
    padding:11px 10px;
    font-family:'Inter', sans-serif;
    font-size:16px;
    width:100%;
    -webkit-appearance:none;
    appearance:none;
  }
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--ice);}
  textarea{resize:vertical; min-height:38px;}

  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:13.5px;
    border:none; border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    transition:transform 0.1s ease, opacity 0.15s ease;
  }
  button:active{transform:scale(0.97);}
  .btn-primary{background:var(--ice); color:var(--navy-deep); grid-column:1 / -1; justify-self:start; padding:10px 22px;}
  .btn-primary:hover{opacity:0.9;}
  .btn-ghost{background:transparent; color:var(--ice-soft); border:1px solid rgba(143,211,244,0.3); padding:6px 12px; font-size:12px;}
  .btn-ghost:hover{border-color:var(--ice);}
  .btn-danger{background:transparent; color:var(--warn); border:1px solid rgba(232,115,74,0.4); padding:6px 12px; font-size:12px;}
  .btn-danger:hover{border-color:var(--warn);}

  .controls{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap;}
  .controls input, .controls select{flex:1; min-width:140px;}

  .tabs{display:flex; gap:6px; margin-bottom:16px;}
  .tab{
    background:transparent; color:var(--ice-soft); border:1px solid rgba(143,211,244,0.2);
    padding:7px 14px; border-radius:20px; font-size:12.5px; cursor:pointer; font-family:'Inter';
  }
  .tab.active{background:var(--ice); color:var(--navy-deep); border-color:var(--ice); font-weight:600;}

  .group-label{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ice);
    text-transform:uppercase; letter-spacing:0.08em; margin:18px 0 8px 2px; opacity:0.75;
  }
  .group-label:first-child{margin-top:0;}

  .item{
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(8,24,38,0.45);
    border:1px solid rgba(143,211,244,0.12);
    border-left:3px solid var(--ice);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:8px;
    gap:12px;
  }
  .item.warn{border-left-color:var(--warn);}
  .item.warn-strong{border-left-color:var(--warn-strong);}
  .item-main{flex:1; min-width:0;}
  .item-name{font-weight:600; font-size:14.5px; color:var(--white);}
  .item-meta{font-size:12px; color:var(--ice-soft); opacity:0.7; margin-top:3px; font-family:'IBM Plex Mono', monospace;}
  .item-note{font-size:12px; color:var(--ice-soft); opacity:0.55; margin-top:3px; font-style:italic;}
  .badge{
    font-family:'IBM Plex Mono', monospace; font-size:11px; padding:3px 9px; border-radius:20px;
    background:rgba(143,211,244,0.12); color:var(--ice-soft); white-space:nowrap;
  }
  .badge.warn{background:rgba(232,115,74,0.15); color:var(--warn);}
  .badge.warn-strong{background:rgba(217,67,43,0.18); color:var(--warn-strong);}
  .badge.ok{background:rgba(79,190,140,0.15); color:var(--ok);}
  .item-actions{display:flex; gap:6px; flex-shrink:0;}

  .empty{text-align:center; padding:40px 20px; color:var(--ice-soft); opacity:0.5; font-size:14px;}
  .loading{text-align:center; padding:30px; color:var(--ice-soft); opacity:0.6; font-size:13px;}

  footer{text-align:center; margin-top:30px;}
  footer button{background:transparent; color:var(--ice-soft); opacity:0.4; border:none; font-size:11px; text-decoration:underline; cursor:pointer;}

  @media (max-width:640px){
    .wrap{padding:22px 14px 0;}
    header{flex-direction:column; align-items:flex-start;}
    .stats{gap:20px; align-self:stretch; justify-content:flex-start;}
    .stat{text-align:left;}
    h1{font-size:23px;}
    .panel{padding:16px;}
    form{grid-template-columns:1fr;}
    .field.full{grid-column:1;}
    .btn-primary{width:100%; justify-self:stretch; text-align:center; padding:13px 16px;}
    .controls{flex-direction:column;}
    .controls input, .controls select{width:100%;}
    .tabs{width:100%;}
    .tab{flex:1; text-align:center;}
    .item{flex-wrap:wrap;}
    .item-main{flex-basis:100%;}
    .badge{order:2;}
    .item-actions{order:3; margin-left:auto;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Le Gouffre 🥶</h1>
      <p class="tagline">Suivi du congélateur tombeau — ce qui rentre, ce qui sort, depuis quand</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="statCount">–</div><div class="l">items actifs</div></div>
      <div class="stat"><div class="n" id="statOld">–</div><div class="l">à surveiller</div></div>
    </div>
  </header>

  <div class="panel">
    <h2>Ajouter une entrée</h2>
    <form id="addForm">
      <div class="field">
        <label>Nom</label>
        <input type="text" id="fNom" placeholder="Ex: cuisses de poulet" required>
      </div>
      <div class="field">
        <label>Catégorie</label>
        <select id="fCat">
          <option value="viande">Viande</option>
          <option value="poisson">Poisson</option>
          <option value="gibier">Gibier / vrac</option>
          <option value="legumes">Légumes</option>
          <option value="plats">Plats préparés</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="field">
        <label>Quantité</label>
        <input type="text" id="fQte" placeholder="Ex: 4 sacs, 1.2kg">
      </div>
      <div class="field">
        <label>Date d'entrée</label>
        <input type="date" id="fDate">
      </div>
      <div class="field full">
        <label>Note (optionnel)</label>
        <input type="text" id="fNote" placeholder="Ex: mariné, à consommer avant tel événement">
      </div>
      <button type="submit" class="btn-primary">Ajouter au congélateur</button>
    </form>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="active">Dans le congélateur</button>
      <button class="tab" data-tab="history">Historique (sorti)</button>
    </div>
    <div class="controls">
      <input type="text" id="searchBox" placeholder="Rechercher un item...">
      <select id="catFilter">
        <option value="">Toutes catégories</option>
        <option value="viande">Viande</option>
        <option value="poisson">Poisson</option>
        <option value="gibier">Gibier / vrac</option>
        <option value="legumes">Légumes</option>
        <option value="plats">Plats préparés</option>
        <option value="autre">Autre</option>
      </select>
      <select id="sortOrder">
        <option value="old">Plus vieux d'abord</option>
        <option value="new">Plus récent d'abord</option>
        <option value="az">Alphabétique</option>
      </select>
    </div>
    <div id="listContainer"><div class="loading">Chargement...</div></div>
  </div>

  <footer><button id="resetBtn">Réinitialiser toutes les données</button></footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// Remplace ces valeurs par la config de TON projet Firebase
// (Console Firebase > Paramètres du projet > Vos applications > SDK config)
const firebaseConfig = {
  apiKey: "AIzaSyCV2LkhNav1Dfd0JR5el_NEkm09Qq5UtwM",
  authDomain: "le-gouffre.firebaseapp.com",
  databaseURL: "https://le-gouffre-default-rtdb.firebaseio.com",
  projectId: "le-gouffre",
  storageBucket: "le-gouffre.firebasestorage.app",
  messagingSenderId: "768459845256",
  appId: "1:768459845256:web:6382d3d14430eabed2793d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const freezerRef = ref(db, 'freezer-data');

const CAT_LABELS = {viande:'Viande', poisson:'Poisson', gibier:'Gibier / vrac', legumes:'Légumes', plats:'Plats préparés', autre:'Autre'};
let data = {active: [], history: []};
let currentTab = 'active';

function loadData(){
  const container = document.getElementById('listContainer');
  container.innerHTML = '<div class="loading">Chargement...</div>';
  onValue(freezerRef, (snapshot) => {
    const val = snapshot.val();
    data = {active: (val && val.active) || [], history: (val && val.history) || []};
    render();
  }, (err) => {
    console.error('Erreur de synchronisation', err);
    container.innerHTML = '<div class="empty">Impossible de se connecter à la base partagée. Vérifie la config Firebase.</div>';
  });
}

async function saveData(){
  try{
    await set(freezerRef, data);
  }catch(e){
    console.error('Erreur de sauvegarde', e);
    alert("Erreur de synchronisation : la modification n'a peut-être pas été partagée.");
  }
}

function daysSince(dateStr){
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / 86400000);
}

function warnLevel(days){
  if(days >= 365) return 'warn-strong';
  if(days >= 240) return 'warn';
  return '';
}

function warnLabel(days){
  if(days >= 365) return `${days} j — plus d'un an`;
  if(days >= 240) return `${days} j — à surveiller`;
  return `${days} j`;
}

function render(){
  document.getElementById('statCount').textContent = data.active.length;
  document.getElementById('statOld').textContent = data.active.filter(i => daysSince(i.date) >= 240).length;

  const search = document.getElementById('searchBox').value.toLowerCase().trim();
  const catFilter = document.getElementById('catFilter').value;
  const sortOrder = document.getElementById('sortOrder').value;

  const source = currentTab === 'active' ? data.active : data.history;
  let items = source.filter(i => {
    const matchSearch = !search || i.nom.toLowerCase().includes(search);
    const matchCat = !catFilter || i.cat === catFilter;
    return matchSearch && matchCat;
  });

  if(currentTab === 'active'){
    if(sortOrder === 'old') items.sort((a,b) => new Date(a.date) - new Date(b.date));
    else if(sortOrder === 'new') items.sort((a,b) => new Date(b.date) - new Date(a.date));
    else items.sort((a,b) => a.nom.localeCompare(b.nom));
  } else {
    items.sort((a,b) => new Date(b.dateSortie) - new Date(a.dateSortie));
  }

  const container = document.getElementById('listContainer');
  if(items.length === 0){
    container.innerHTML = `<div class="empty">${currentTab === 'active' ? "Rien ici pour l'instant. Ajoute ta première entrée ci-dessus." : "Aucun historique pour ces filtres."}</div>`;
    return;
  }

  // group by category
  const grouped = {};
  items.forEach(i => {
    if(!grouped[i.cat]) grouped[i.cat] = [];
    grouped[i.cat].push(i);
  });

  let html = '';
  Object.keys(grouped).forEach(cat => {
    html += `<div class="group-label">${CAT_LABELS[cat] || cat}</div>`;
    grouped[cat].forEach(i => {
      if(currentTab === 'active'){
        const days = daysSince(i.date);
        const level = warnLevel(days);
        html += `
          <div class="item ${level}">
            <div class="item-main">
              <div class="item-name">${escapeHtml(i.nom)}${i.qte ? ' — ' + escapeHtml(i.qte) : ''}</div>
              <div class="item-meta">Entré le ${formatDate(i.date)}</div>
              ${i.note ? `<div class="item-note">${escapeHtml(i.note)}</div>` : ''}
            </div>
            <span class="badge ${level}">${warnLabel(days)}</span>
            <div class="item-actions">
              <button class="btn-ghost" onclick="markOut('${i.id}')">Sortir</button>
              <button class="btn-danger" onclick="deleteItem('${i.id}', 'active')">Suppr.</button>
            </div>
          </div>`;
      } else {
        html += `
          <div class="item">
            <div class="item-main">
              <div class="item-name">${escapeHtml(i.nom)}${i.qte ? ' — ' + escapeHtml(i.qte) : ''}</div>
              <div class="item-meta">Entré le ${formatDate(i.date)} · sorti le ${formatDate(i.dateSortie)}</div>
              ${i.note ? `<div class="item-note">${escapeHtml(i.note)}</div>` : ''}
            </div>
            <span class="badge ok">${daysSince(i.date) - daysSince(i.dateSortie)} j au congel</span>
            <div class="item-actions">
              <button class="btn-danger" onclick="deleteItem('${i.id}', 'history')">Suppr.</button>
            </div>
          </div>`;
      }
    });
  });
  container.innerHTML = html;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function formatDate(dateStr){
  const d = new Date(dateStr);
  return d.toLocaleDateString('fr-CA', {day:'numeric', month:'short', year:'numeric'});
}

window.markOut = async function(id){
  const idx = data.active.findIndex(i => i.id === id);
  if(idx === -1) return;
  const item = data.active.splice(idx, 1)[0];
  item.dateSortie = new Date().toISOString().slice(0,10);
  data.history.unshift(item);
  await saveData();
  render();
};

window.deleteItem = async function(id, list){
  data[list] = data[list].filter(i => i.id !== id);
  await saveData();
  render();
};

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nom = document.getElementById('fNom').value.trim();
  if(!nom) return;
  const item = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    nom,
    cat: document.getElementById('fCat').value,
    qte: document.getElementById('fQte').value.trim(),
    date: document.getElementById('fDate').value || new Date().toISOString().slice(0,10),
    note: document.getElementById('fNote').value.trim()
  };
  data.active.push(item);
  await saveData();
  e.target.reset();
  render();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    render();
  });
});

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('catFilter').addEventListener('change', render);
document.getElementById('sortOrder').addEventListener('change', render);

document.getElementById('resetBtn').addEventListener('click', async () => {
  if(!confirm('Effacer toutes les données du congélateur ? Cette action est irréversible.')) return;
  data = {active: [], history: []};
  await saveData();
  render();
});

document.getElementById('fDate').valueAsDate = new Date();

loadData();
</script>
</body>
</html>
